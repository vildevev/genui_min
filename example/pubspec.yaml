name: genui_min_example
description: Runnable demo for genui_min — on-device LLM driving the A2UI renderer.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  a2ui_core: ^0.6.0
  a2ui_flutter: ^0.2.0
  genui_min:
    path: ../
  # The on-device LLM backend for the live demo. Optional — the "sample output"
  # mode works without any model.
  flutter_gemma: ^0.16.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
