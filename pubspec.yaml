name: genui_min
description: >-
  Generative UI from a small on-device LLM: one widget (GenuiMinSurface), a
  minimal styled genui/A2UI component catalog whose system prompt fits a 2-4B
  model, and a deterministic repair pass for small-model output.
version: 0.3.0
repository: https://github.com/vildevev/genui_min
issue_tracker: https://github.com/vildevev/genui_min/issues
topics:
  genai
  llm
  ui
  a2ui

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  # The real Google generative-UI / A2UI renderer.
  genui: ^0.9.0
  # Schema builder (S.*) used to declare the custom catalog item schemas.
  json_schema_builder: ^0.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

screenshots:
  - path: doc/hero.png
    description: A prompt turned into a rendered Flutter card by an on-device LLM
  - path: doc/card-today.png
    description: A generated 'Today synthesis' card with a Stat metric
  - path: doc/card-weekly.png
    description: A generated 'Weekly brief' card with a Stat metric

flutter:
