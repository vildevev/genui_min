name: genui_min
description: >-
  Drive Google's genui / A2UI renderer with a small on-device LLM: a minimal
  styled component catalog plus a deterministic repair pass for small-model output.
version: 0.1.0
repository: https://github.com/your-org/genui_min
issue_tracker: https://github.com/your-org/genui_min/issues

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  # The real Google generative-UI / A2UI renderer.
  genui: ^0.9.0
  # Schema builder (S.*) used to declare the custom catalog item schemas.
  json_schema_builder: ^0.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
